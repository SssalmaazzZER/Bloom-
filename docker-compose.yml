# Bloomé — local stack
#   Database only (recommended for development):  docker compose up -d postgres
#   Full application (DB + API + web):            docker compose --profile full up -d --build
# Values come from .env (copy .env.example to .env first).

services:
  postgres:
    image: postgres:16-alpine
    container_name: bloome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloome}
      POSTGRES_USER: ${POSTGRES_USER:-bloome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bloome-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloome} -d ${POSTGRES_DB:-bloome}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["full"]
    build: ./backend
    container_name: bloome-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bloome}
      DB_USERNAME: ${POSTGRES_USER:-bloome}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed}
      BLOOME_ADMIN_EMAIL: ${BLOOME_ADMIN_EMAIL:-}
      BLOOME_ADMIN_PASSWORD: ${BLOOME_ADMIN_PASSWORD:-}
      BLOOME_DEMO_ACCOUNTS: ${BLOOME_DEMO_ACCOUNTS:-false}
    ports:
      - "8080:8080"

  frontend:
    profiles: ["full"]
    build: ./frontend
    container_name: bloome-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  bloome-pgdata:
