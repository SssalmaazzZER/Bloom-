spring:
  application:
    name: bloome-backend
  # Lets `./mvnw spring-boot:run` pick up the project's .env file (real environment variables win).
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloome}
    username: ${DB_USERNAME:bloome}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Production: set FLYWAY_LOCATIONS=classpath:db/migration to skip the demo catalog.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Behind nginx / a load balancer: take the client IP and scheme from X-Forwarded-* headers, but only
  # when the request comes from a private-network proxy (Tomcat RemoteIpValve defaults). Needed for
  # per-client rate limiting and Secure cookies behind TLS termination.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        name: BLOOME_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    ma.bloome: INFO
    org.hibernate.SQL: WARN

bloome:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    # Creates an admin on startup when both are set and no user with that email exists.
    admin-email: ${BLOOME_ADMIN_EMAIL:}
    admin-password: ${BLOOME_ADMIN_PASSWORD:}
    # Creates the documented local demo accounts. NEVER enable in production.
    demo-accounts: ${BLOOME_DEMO_ACCOUNTS:false}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  shop:
    time-zone: Africa/Casablanca
    currency: MAD
    delivery-fee: 35.00
    free-delivery-threshold: 500.00
    gift-wrapping-fee: 25.00
    same-day-cutoff-hour: 14
    max-days-ahead: 30
    delivery-cities: Rabat,Salé,Témara,Kénitra,Casablanca,Mohammédia
  bouquet:
    min-stems: 5
    max-stems: 40
  inventory:
    low-stock-default: 5
